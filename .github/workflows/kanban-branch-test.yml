name: Kanban branch test

on:
  push:
    branches: [codex/unlock-kanban]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake db:create db:schema:load
      - run: bundle exec rspec spec/controllers/api/v1/accounts/kanban_controller_spec.rb
      - run: bundle exec rubocop app/controllers/api/v1/accounts/kanban_controller.rb spec/controllers/api/v1/accounts/kanban_controller_spec.rb
      - run: ruby scripts/i18n/fork_translations.rb check
