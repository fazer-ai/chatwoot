name: Build Custom EE Image with Customizations

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'v*.*.*-fazer-ai.*-ee'
      - 'v*.*.*-fazer-ai.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v4.10.0-fazer-ai.15-ee)'
        required: true
        type: string

env:
  GITHUB_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Use input from workflow_dispatch or extract from tag
      GIT_REF: ${{ github.event.inputs.version_tag || github.ref_name }}
      VERSION: ${{ github.event.inputs.version_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Update version in app.yml
        run: |
          # Extract version from tag (remove 'v' prefix and '-ee' suffix if present)
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          VERSION="${VERSION%-ee}"  # Remove '-ee' suffix if present
          echo "Updating version to: $VERSION"
          sed -i "s/version: '.*'/version: '$VERSION'/" config/app.yml
          echo "Version updated in config/app.yml:"
          grep version config/app.yml

      - name: Set Docker Tags
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          # Ensure -ee suffix
          if [[ ! "$SANITIZED_REF" =~ -ee$ ]]; then
            SANITIZED_REF="${SANITIZED_REF}-ee"
          fi
          echo "SANITIZED_REF=${SANITIZED_REF}" >> $GITHUB_ENV
          echo "Image will be tagged as: ${GITHUB_REPO}:${SANITIZED_REF}"

      - name: Verify Customizations
        run: |
          echo "Verifying customizations are present..."
          if grep -q "OPERATOR_TYPES_7" app/javascript/dashboard/routes/dashboard/settings/automation/operators.js; then
            echo "✅ OPERATOR_TYPES_7 found in operators.js"
          else
            echo "❌ OPERATOR_TYPES_7 NOT found - aborting"
            exit 1
          fi
          
          if grep -q "text: OPERATOR_TYPES_7" app/javascript/dashboard/helper/automationHelper.js; then
            echo "✅ automationHelper.js correctly references OPERATOR_TYPES_7"
          else
            echo "❌ automationHelper.js missing OPERATOR_TYPES_7 reference - aborting"
            exit 1
          fi
          
          if [ -f app/services/filter_service.rb ]; then
            echo "✅ filter_service.rb exists"
          else
            echo "❌ filter_service.rb NOT found - aborting"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GITHUB_REPO }}:${{ env.SANITIZED_REF }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.event.inputs.version_tag || github.ref_name }}
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          # Ensure -ee suffix
          if [[ ! "$SANITIZED_REF" =~ -ee$ ]]; then
            SANITIZED_REF="${SANITIZED_REF}-ee"
          fi
          
          echo "Creating multi-arch manifest for: ${SANITIZED_REF}"
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${SANITIZED_REF} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        env:
          GIT_REF: ${{ github.event.inputs.version_tag || github.ref_name }}
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          if [[ ! "$SANITIZED_REF" =~ -ee$ ]]; then
            SANITIZED_REF="${SANITIZED_REF}-ee"
          fi
          REPO="ghcr.io/${{ github.repository }}"
          echo "Built image: ${REPO}:${SANITIZED_REF}"
          docker buildx imagetools inspect ${REPO}:${SANITIZED_REF}
