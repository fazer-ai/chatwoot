version: 2
updates:
  # Only the WhatsApp connector the image embeds. The base images follow upstream Chatwoot
  # and are moved with it, not by this file.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    allow:
      - dependency-name: ghcr.io/fazer-ai/whatsapp-connector
    # One connector bump at a time: a newer release replaces the open PR instead of
    # stacking a second one behind it.
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
