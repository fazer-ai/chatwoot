- tag: v4.13.0-auris.1.32
  published_at: '2026-06-22T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.32
  notes:
    en: |-
      ### ✨ What's new

      - **Auris Notification Center.** The Auris team can now send you announcements (maintenance, news) directly inside the panel. When there's something to read, a window pops up and stays until you click "I understand". You can revisit the 10 most recent notices any time from the new "Notification Center" menu.
    pt_BR: |-
      ### ✨ Novidades

      - **Central de Notificação Auris.** A equipe Auris agora consegue te enviar avisos (manutenções, novidades) direto pelo painel. Quando tiver algo, uma janela aparece e fica na tela até você apertar "Entendi". Você pode rever os 10 mais recentes a qualquer hora no novo menu "Central de Notificação".
- tag: v4.13.0-auris.1.31.9
  published_at: '2026-06-21T01:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.9
  notes:
    en: |-
      ### 🐛 Fixes

      - **Direct messages on Instagram inboxes added recently start arriving.** A previous attempt to work around a Meta API outage saved the wrong Instagram identifier on newly added inboxes, so when patients sent a direct message the system couldn't find which inbox to route it to and the message was silently dropped. Inboxes added with this release work end-to-end. Inboxes connected during the outage window need to be removed and added again to be fixed.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens diretas em caixas do Instagram adicionadas recentemente passam a chegar.** Uma tentativa anterior de contornar uma instabilidade do Meta gravava o identificador errado do Instagram nas caixas novas, então quando os pacientes mandavam Direct o sistema não conseguia encontrar a qual caixa rotear a mensagem e ela era descartada silenciosamente. Caixas adicionadas a partir desta versão funcionam ponta a ponta. Caixas conectadas durante a janela com problema precisam ser removidas e adicionadas de novo para serem corrigidas.
- tag: v4.13.0-auris.1.31.8
  published_at: '2026-06-19T23:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.8
  notes:
    en: |-
      ### 🐛 Fixes

      - **Incoming Instagram DMs reach AurisChat.** Meta was rejecting the call AurisChat makes when a new inbox is created to subscribe it to incoming-message webhooks, so direct messages never reached the panel. The integration now tries multiple request shapes until one works and exposes a manual re-subscribe entry point for inboxes that were created during the outage.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens recebidas no Direct do Instagram chegam ao AurisChat.** O Meta estava rejeitando a chamada que o AurisChat faz quando uma caixa nova é criada para registrar o recebimento de mensagens, então as mensagens do direct não chegavam no painel. A integração agora tenta vários formatos de requisição até um passar e expõe um ponto de reinscrição manual para caixas que foram criadas durante a janela do problema.
- tag: v4.13.0-auris.1.31.7
  published_at: '2026-06-19T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.7
  notes:
    en: |-
      ### 🐛 Fixes

      - **Adding a new Instagram inbox finally finishes.** Meta has been rejecting the `/me` endpoint with both POST and GET on Instagram Business Login tokens, blocking the OAuth callback even after the previous round of fixes. AurisChat now skips `/me` entirely — the Instagram user ID already comes in the OAuth response — so the inbox connects with a placeholder name when needed. You can rename the inbox from settings afterwards.
    pt_BR: |-
      ### 🐛 Correções

      - **Adicionar uma nova caixa de entrada do Instagram finalmente conclui.** O Meta passou a rejeitar o endpoint `/me` com POST e GET para tokens do Instagram Business Login, bloqueando o callback do OAuth mesmo depois das correções anteriores. O AurisChat agora pula o `/me` por completo — o ID do usuário Instagram já vem na resposta do OAuth — então a caixa conecta com um nome padrão quando necessário. Você pode renomear a caixa em configurações depois.
- tag: v4.13.0-auris.1.31.6
  published_at: '2026-06-19T19:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.6
  notes:
    en: |-
      ### 🐛 Fixes

      - **Instagram integration hardened end-to-end.** All Instagram API calls (connect a new inbox, send and receive messages, periodic token refresh, webhook registration) now share the same API version and automatically retry with the alternate HTTP method when Meta swings between GET and POST. Silent failures on webhook subscribe/unsubscribe are now logged so the operator notices when something breaks.
    pt_BR: |-
      ### 🐛 Correções

      - **Integração com Instagram reforçada de ponta a ponta.** Todas as chamadas para a API do Instagram (conectar nova caixa, enviar e receber mensagens, renovação periódica de token, registro de webhooks) agora compartilham a mesma versão de API e automaticamente reentregam com o método HTTP alternativo quando o Meta alterna entre GET e POST. Falhas silenciosas no subscribe/unsubscribe de webhook agora aparecem nos logs para o operador perceber.
- tag: v4.13.0-auris.1.31.5
  published_at: '2026-06-19T15:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.5
  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting a new Instagram inbox finishes successfully.** Follow-up to the previous fix: the user-details step of the OAuth callback was pinned to an older Meta API version and started returning the same cryptic error. Pinned to the version the Meta App is configured for, and the inbox now finishes connecting.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de uma nova caixa de entrada do Instagram finaliza com sucesso.** Sequência da correção anterior: o passo de buscar os dados do usuário no callback do OAuth estava preso em uma versão antiga da API do Meta e passou a retornar o mesmo erro confuso. Atualizamos para a versão que o app no Meta está configurado e a caixa de entrada termina de conectar normalmente.
- tag: v4.13.0-auris.1.31.4
  published_at: '2026-06-19T04:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.4
  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting a new Instagram inbox works again.** The OAuth callback was failing during the long-lived token exchange because Meta's Instagram Business Login now returns a long-lived token directly, with no exchange step needed. AurisChat skips the legacy exchange in that case and the inbox finishes connecting cleanly.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de nova caixa de entrada do Instagram voltou a funcionar.** O callback do OAuth falhava na troca para o token de longa duração porque o Instagram Business Login do Meta passou a entregar o token já longo direto, sem precisar de troca. O AurisChat agora pula essa etapa quando ela não é necessária e a caixa de entrada conecta normalmente.
