  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.23.3
  notes:
    en: |-
      ### 🐛 Fixes

      - **Automation activity messages now match the account language.** Activity entries triggered by automation rules (assignment, team, label, AI status changes) were always rendered in English, even on Portuguese accounts. They now follow the account's configured language.
    pt_BR: |-
