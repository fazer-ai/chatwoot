- tag: v4.15.1-auris.1.39
  published_at: '2026-07-06T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.39
  notes:
    en: |-
      ### ✨ What's new

      - **Company on contacts.** The contact form has a new field to link the person to their company or health plan.
      - **Filter conversations by contact + full search.** You can filter to a single patient's conversations. And there's a new search page that looks across conversations, contacts and messages at once.
      - **Contact media tab.** A new side tab lists everything the patient has sent (photos, PDFs, audio).
      - **Rearrange your sidebar.** Drag folders, teams, channels and labels into whatever order works for you, and hide the ones you don't use.
      - **WhatsApp templates fill in the media for you.** When a template has example media, the field shows up already filled.

      ### ⚡ Improvements

      - **Unread message counts are back.** On totals, inboxes, labels and teams.
      - **See and close open sessions.** From your profile, you can see which devices you're logged in on and disconnect any of them.
      - **Mobile sessions show the right name.** Used to say "Unknown Device"; now shows "AurisChat Mobile".
      - **Richer Help Center.** Categories with icon/emoji, resizable images in articles, move multiple articles between categories in one go.
    pt_BR: |-
      ### ✨ Novidades

      - **Empresa nos contatos.** O cadastro de contato agora tem um campo pra vincular a empresa/convênio da pessoa.
      - **Filtrar conversas por contato + busca completa.** Você pode filtrar as conversas de um paciente específico. E ganhou uma tela nova de busca que procura em conversas, contatos e mensagens ao mesmo tempo.
      - **Aba de mídias do contato.** Uma aba lateral mostra tudo que o paciente já mandou (fotos, PDFs, áudios).
      - **Reorganizar sua barra lateral.** Você pode arrastar folders, times, canais e etiquetas na ordem que quiser, e esconder o que não usa.
      - **Templates de WhatsApp já vêm com a mídia preenchida.** Quando o template tem uma mídia de exemplo, o campo aparece pronto.

      ### ⚡ Melhorias

      - **Contadores de mensagens não lidas voltam.** Nos totais, caixas, etiquetas e times.
      - **Ver e encerrar sessões abertas.** No seu perfil, você vê em quais dispositivos está logada e pode desconectar de qualquer um.
      - **Sessões do celular aparecem com o nome certo.** Antes ficava "Dispositivo desconhecido"; agora mostra "AurisChat Mobile".
      - **Central de ajuda mais rica.** Categorias com ícone/emoji, imagens redimensionáveis em artigos, mover vários artigos de categoria de uma vez.
- tag: v4.14.0-auris.1.38.1
  published_at: '2026-07-06T18:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.14.0-auris.1.38.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **The enable/disable AI button for bulk conversations works again.** Before, clicking it did nothing. Now the menu opens correctly and you can apply the change to all selected conversations.
      - **Unassign labels from several conversations at once.** Select the conversations, use the new button, and pick which labels to remove.

      ### ⚡ Improvements

      - **Unassign label on Contacts is clearer.** The icon is now different from "Assign label" (so you don't confuse the two) and the list only shows labels actually present on the selected contacts.
    pt_BR: |-
      ### 🐛 Correções

      - **O botão para ligar/desligar a IA em várias conversas voltou a funcionar.** Antes você clicava e nada acontecia. Agora o menu aparece direitinho e você aplica para todas.
      - **Desatribuir etiquetas em várias conversas de uma vez.** Selecione as conversas, use o novo botão e escolha quais etiquetas remover.

      ### ⚡ Melhorias

      - **Nos contatos, desatribuir rótulo ficou mais claro.** O ícone agora é diferente do "atribuir rótulo" (não confunde mais os dois botões) e a lista só mostra rótulos que realmente estão nos contatos selecionados.
- tag: v4.14.0-auris.1.38
  published_at: '2026-07-06T17:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.14.0-auris.1.38
  notes:
    en: |-
      ### ✨ What's new

      - **Ad referral tag on inbound messages.** When a patient replies via a WhatsApp ad, the conversation now shows which campaign brought them in.
      - **Message edits from the patient show up.** If the patient edits a message on WhatsApp, the edit reflects on the timeline (previous version preserved). If they delete a message, the bubble is marked as deleted.
      - **Reply and react on internal notes.** Same shortcuts you use on regular messages now work on team notes too.

      ### ⚡ Improvements

      - **Brazilian phone with/without "9" no longer creates duplicate contacts.** The system reuses the existing contact regardless of the format.
      - **When a message fails to send, the reason now appears on the bubble.**
    pt_BR: |-
      ### ✨ Novidades

      - **Etiqueta de anúncio nas mensagens que chegam.** Quando o paciente responde por um anúncio do WhatsApp, a conversa agora mostra de qual campanha ele veio.
      - **Edição de mensagem do paciente aparece.** Se o paciente edita uma mensagem no WhatsApp, a edição reflete na timeline (versão anterior preservada). Se ele apaga, a bolha fica marcada como apagada.
      - **Responder e reagir em anotações internas.** Os mesmos atalhos que você usa em mensagens normais agora funcionam nas notas de equipe também.

      ### ⚡ Melhorias

      - **Número brasileiro com/sem "9" deixa de criar contato duplicado.** O sistema reusa o contato existente independente do formato.
      - **Quando uma mensagem falha ao enviar, o motivo agora aparece na bolha.**
