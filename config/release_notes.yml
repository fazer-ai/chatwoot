      - **Mensagens para números brasileiros deixam de travar em "enviada".** Contatos com número brasileiro cuja conta do WhatsApp está registrada no formato antigo de 12 dígitos não estavam entregando. Mensagens para contatos novos agora chegam no WhatsApp normalmente.
