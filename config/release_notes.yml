- tag: v4.13.0-auris.1.27
  published_at: '2026-06-16T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.27
  notes:
    en: |-
      ### ⚡ Improvements

      - **WhatsApp keeps up better when things are busy.** Patient messages arrive faster even when there's a lot of delivery and read confirmations coming in at the same time — they no longer have to wait in line behind those.

      ### 🐛 Fixes

      - **The checkmark color of a sent message doesn't rewind anymore.** Before, the message marker could turn blue (the patient read) and briefly go back to gray, making it look like the patient hadn't seen it yet. Now once it shows the patient read, it stays that way.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O WhatsApp acompanha melhor o ritmo quando está cheio.** As mensagens dos pacientes chegam mais rápido mesmo quando vêm muitas confirmações de entrega e leitura ao mesmo tempo — elas não precisam mais esperar atrás dessas confirmações.

      ### 🐛 Correções

      - **O check de mensagem enviada não volta atrás.** Antes, o marcador podia ficar azul (paciente leu) e voltar pra cinza por um instante, dando a impressão de que ele ainda não tinha visto. Agora, depois que aparece como lido, fica desse jeito.
- tag: v4.13.0-auris.1.26
  published_at: '2026-06-15T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.26
  notes:
    en: |-
      ### ⚡ Improvements

      - **WhatsApp moves faster when the system is busy.** Pairing a device with the QR code, and the arrival of patient messages, no longer have to wait in line behind background work — they come through right away even at busy moments.

      ### 🐛 Fixes

      - **Cleaner error message when WhatsApp is down.** When the red flag appears on a message it now shows the actual reason WhatsApp gave (out of service, expired token, etc.) instead of a generic technical message — so you know what to do without having to ask someone.
      - **Template list refreshes by itself again.** If management adds a new template in WhatsApp, you don't need to click "Sync templates" anymore — within a couple of hours the new template just appears in your dropdown automatically.
    pt_BR: |-
      ### ⚡ Melhorias

      - **WhatsApp anda mais rápido quando o sistema está cheio.** Pareamento do aparelho pelo QR code e a chegada das mensagens dos pacientes não precisam mais esperar uma fila de tarefas de fundo — vêm direto, mesmo em momentos de muito movimento.

      ### 🐛 Correções

      - **Mensagem de erro mais clara quando o WhatsApp falha.** Quando aparece a bandeira vermelha em uma mensagem, agora ela mostra a causa real que o WhatsApp deu (fora do ar, token vencido, etc.) em vez de um aviso genérico técnico — você sabe o que fazer sem precisar perguntar pra alguém.
      - **Lista de modelos volta a se atualizar sozinha.** Se a gestão criar um modelo novo no WhatsApp, você não precisa mais clicar em "Sincronizar Modelos" — em algumas horas o modelo novo já aparece na sua lista automaticamente.
- tag: v4.13.0-auris.1.25
  published_at: '2026-06-10T01:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.25
  notes:
    en: |-
      ### ✨ What's new

      - **New "AI → Human" report.** A new report under **Reports** where the manager can see, line by line, every conversation Auris AI handed off in the last 7 days — which team, which agent, who was online at the time, and whether it actually reached someone or got stuck.
      - **Managers can manage their teams.** If you have the manager role, you can now go into **Settings → Teams**, add or remove agents from a team and turn automatic assignment on or off — no need to ask the administrator anymore.
    pt_BR: |-
      ### ✨ Novidades

      - **Novo relatório "IA → Humano".** Um relatório novo dentro de **Relatórios** onde o gestor consegue ver, linha por linha, cada conversa que a Auris distribuiu nos últimos 7 dias — qual time, qual agente, quem estava online no momento e se a conversa de fato foi pra alguém ou ficou parada.
      - **Gerentes podem cuidar dos times.** Quem tem o papel de gerente agora consegue entrar em **Configurações → Times**, entrar e sair agentes do time e ligar ou desligar a atribuição automática — sem precisar chamar o administrador.
- tag: v4.13.0-auris.1.24.10
  published_at: '2026-06-05T01:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.10
  notes:
    en: |-
      ### ⚡ Improvements

      - **Patient phone automatically matched to WhatsApp.** When you create a patient through the pencil button and type the phone without the "9", AurisChat checks WhatsApp and adjusts to the right format — the first message goes through and no duplicate contact appears later.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Telefone do paciente acertado automaticamente.** Quando você cadastra um paciente pelo lápis com o telefone sem o "9", o AurisChat confere com o WhatsApp e ajusta para o formato certo — a primeira mensagem já chega e não aparece contato duplicado depois.
