- tag: v4.13.0-auris.1.31.9
  published_at: '2026-06-21T01:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.9
  notes:
    en: |-
      ### 🐛 Fixes

      - **Direct messages on Instagram inboxes added recently start arriving.** A previous attempt to work around a Meta API outage saved the wrong Instagram identifier on newly added inboxes, so when patients sent a direct message the system couldn't find which inbox to route it to and the message was silently dropped. Inboxes added with this release work end-to-end. Inboxes connected during the outage window need to be removed and added again to be fixed.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens diretas em caixas do Instagram adicionadas recentemente passam a chegar.** Uma tentativa anterior de contornar uma instabilidade do Meta gravava o identificador errado do Instagram nas caixas novas, então quando os pacientes mandavam Direct o sistema não conseguia encontrar a qual caixa rotear a mensagem e ela era descartada silenciosamente. Caixas adicionadas a partir desta versão funcionam ponta a ponta. Caixas conectadas durante a janela com problema precisam ser removidas e adicionadas de novo para serem corrigidas.
- tag: v4.13.0-auris.1.31.8
  published_at: '2026-06-19T23:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.8
  notes:
    en: |-
      ### 🐛 Fixes

      - **Incoming Instagram DMs reach AurisChat.** Meta was rejecting the call AurisChat makes when a new inbox is created to subscribe it to incoming-message webhooks, so direct messages never reached the panel. The integration now tries multiple request shapes until one works and exposes a manual re-subscribe entry point for inboxes that were created during the outage.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens recebidas no Direct do Instagram chegam ao AurisChat.** O Meta estava rejeitando a chamada que o AurisChat faz quando uma caixa nova é criada para registrar o recebimento de mensagens, então as mensagens do direct não chegavam no painel. A integração agora tenta vários formatos de requisição até um passar e expõe um ponto de reinscrição manual para caixas que foram criadas durante a janela do problema.
