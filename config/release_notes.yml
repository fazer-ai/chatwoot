    en: |-
      ### 🐛 Fixes

      - **Instagram direct messages stop disappearing.** When several patient messages arrived for the same Instagram contact at the same time, some used to be silently dropped — the inbox felt offline until the next message came through. Messages now reach AurisChat reliably even at busy moments.
    pt_BR: |-
