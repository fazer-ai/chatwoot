- tag: v4.13.0-auris.1.23.1
  published_at: '2026-05-24T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.23.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Enable/Disable AI actions in Automation Rules can be saved again.** Adding **Enable AI** or **Disable AI** as an automation action was showing an "Action parameters are required" error and blocking the form. The actions now save without asking for parameters.
    pt_BR: |-
      ### 🐛 Correções

      - **Ações Ativar/Desativar IA voltam a salvar nas Regras de Automação.** Selecionar **Ativar IA** ou **Desativar IA** como ação estava exibindo o erro "Os parâmetros de ação são necessários" e bloqueando o salvamento. Agora as ações são aceitas sem exigir parâmetro.
- tag: v4.13.0-auris.1.23
  published_at: '2026-05-24T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.23
  notes:
    en: |-
      ### ✨ What's new

      - **Toggle AI on or off in bulk from the conversation list.** Pick multiple conversations, open the new toolbar button, and choose to enable (green) or disable (red) the AI on all of them at once.
      - **AI status in Automation Rules.** You can now use the AI status as a condition ("equals AI Enabled / AI Disabled") and as an action ("Enable AI" / "Disable AI") in any rule — available across every event (conversation created, updated, opened, resolved, and message created).
    pt_BR: |-
      ### ✨ Novidades

      - **Ativar ou desativar a IA em massa direto da lista de conversas.** Selecione várias conversas, abra o novo botão no toolbar de seleção e escolha entre ativar (verde) ou desativar (vermelho) a IA em todas de uma vez.
      - **Status da IA nas Regras de Automação.** Agora dá pra usar o status da IA como condição ("Igual a IA Ativada / IA Desativada") e como ação ("Ativar IA" / "Desativar IA") em qualquer regra — disponível em todos os eventos (conversa criada, atualizada, aberta, resolvida e mensagem criada).
