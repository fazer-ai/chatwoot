- tag: v4.13.0-auris.1.20
  published_at: '2026-05-16T18:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.20
  notes:
    en: |-
      ### ✨ What's new

      - **AI vs manual breakdown in the Funnel Conversion chart.** Each stage now shows two stacked colored layers — green for AI-handled conversations, blue for manual ones — and hovering a stage reveals the percentage split for that stage.
      - **Loss reasons donut.** A new chart next to the funnel breaks down lost conversations by reason, with a color-coded legend.
      - **Inbox and label filters in the funnel reports.** Two new dropdowns let you scope every number and chart in the funnel to a specific inbox or to conversations carrying a specific label.

      ### ⚡ Improvements

      - **Conversion KPIs reframed around attendance.** Four new rates replace the previous "Top / Completed / Win rate" set: Scheduling rate, Confirmation rate, Attendance rate (formerly win rate), and No-show rate — all expressed as a percent of total leads.
      - **Stage rename.** "Ganho" is now displayed as "Comparecimento (ganho)" across the conversion chart, matching the clinical attendance vocabulary.

      ### 🐛 Fixes

      - **Funnel stages populate correctly in production.** Earlier installations could end up with an empty Funnel Stages list when a migration silently failed; the canonical 9 stages are now automatically backfilled.
    pt_BR: |-
      ### ✨ Novidades

      - **Divisão IA vs manual no Funil de Conversão.** Cada fase agora aparece em duas camadas empilhadas — verde para conversas atendidas pela IA, azul para atendidas manualmente — e ao passar o mouse sobre uma fase você vê a divisão percentual daquela fase.
      - **Distribuição de motivos de perda.** Novo gráfico ao lado do funil mostra a quebra das conversas perdidas por motivo, com legenda colorida.
      - **Filtros de caixa de entrada e etiquetas nos relatórios do funil.** Dois novos selects permitem escopar todos os números e gráficos do funil para uma caixa específica ou para conversas com uma etiqueta específica.

      ### ⚡ Melhorias

      - **KPIs da Conversão reformulados para foco em comparecimento.** Quatro novas taxas substituem o conjunto anterior "Topo / Concluídas / Taxa de ganho": Taxa de agendamento, Taxa de confirmação, Taxa de comparecimento (ganho) e Taxa de no-show — todas expressas como % do total de leads.
      - **Renomeação de etapa.** "Ganho" agora aparece como "Comparecimento (ganho)" no gráfico de conversão, alinhando-se ao vocabulário de comparecimento clínico.

      ### 🐛 Correções

      - **Fases do funil agora populam corretamente em produção.** Instalações anteriores podiam acabar com a lista de Fases vazia por causa de uma migração que falhava silenciosamente; as 9 fases padrão agora são preenchidas automaticamente.
- tag: v4.13.0-auris.1.19.1
  published_at: '2026-05-15T02:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.19.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Account pages in Super Admin load again.** The Super Admin → Accounts edit and show pages were broken since v1.19 (when the *Auris menus* section was added). Fixed.
    pt_BR: |-
      ### 🐛 Correções

      - **Páginas de Conta no Super Admin voltam a abrir.** A edição e visualização de contas em Super Admin → Accounts estavam quebradas desde a v1.19 (quando a seção *Auris menus* foi adicionada). Corrigido.
- tag: v4.13.0-auris.1.19
  published_at: '2026-05-15T01:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.19
  notes:
    en: |-
      ### ✨ What's new

      - **Two new funnel views inside the Funnel menu.** Alongside *Board* and *List*, you now have **Overview** (per-stage table with entries in the period, average time in stage, won and lost counts) and **Conversion** (a horizontal sales-funnel chart showing how leads narrow down through the stages).
      - **Per-account sidebar menu controls in Super Admin.** From the new *Auris menus* section under Super Admin → Accounts, you can now toggle the **Inbox** and **Help Center** sidebar menus on or off independently for each account.

      ### ⚡ Improvements

      - **Cleaner sales-funnel display.** The Conversion chart groups the scheduling stages into a single bar, hides closed-without-sale outcomes from the chart (they still count toward the closed-deal KPIs), and uses display names aligned with how a sales team actually talks about leads.
    pt_BR: |-
      ### ✨ Novidades

      - **Dois novos modos dentro do menu Funil.** Ao lado de *Quadro* e *Lista*, agora você tem também **Visão geral** (tabela com entradas no período, tempo médio em cada fase, ganhas e perdidas) e **Conversão** (gráfico horizontal de funil de vendas mostrando como os leads avançam até a conclusão).
      - **Controle de menus por conta no Super Admin.** Na nova seção *Auris menus* em Super Admin → Accounts, você consegue ativar ou desativar os menus **Caixa de Entrada** e **Central de Ajuda** independentemente por conta.

      ### ⚡ Melhorias

      - **Visual do funil de conversão alinhado com vendas.** O gráfico de Conversão agrupa as etapas de agendamento numa fase só ("Agendamento"), esconde os estados terminais sem venda (continuam contando nas métricas de fechamento) e usa nomes alinhados com a forma como o time comercial fala — "Total de leads" no topo, "Vendas realizadas" no fechamento.
