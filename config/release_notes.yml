- tag: v4.13.0-auris.1.31.7
  published_at: '2026-06-19T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.7
  notes:
    en: |-
      ### 🐛 Fixes

      - **Adding a new Instagram inbox finally finishes.** Meta has been rejecting the `/me` endpoint with both POST and GET on Instagram Business Login tokens, blocking the OAuth callback even after the previous round of fixes. AurisChat now skips `/me` entirely — the Instagram user ID already comes in the OAuth response — so the inbox connects with a placeholder name when needed. You can rename the inbox from settings afterwards.
    pt_BR: |-
      ### 🐛 Correções

      - **Adicionar uma nova caixa de entrada do Instagram finalmente conclui.** O Meta passou a rejeitar o endpoint `/me` com POST e GET para tokens do Instagram Business Login, bloqueando o callback do OAuth mesmo depois das correções anteriores. O AurisChat agora pula o `/me` por completo — o ID do usuário Instagram já vem na resposta do OAuth — então a caixa conecta com um nome padrão quando necessário. Você pode renomear a caixa em configurações depois.
- tag: v4.13.0-auris.1.31.6
  published_at: '2026-06-19T19:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.6
  notes:
    en: |-
      ### 🐛 Fixes

      - **Instagram integration hardened end-to-end.** All Instagram API calls (connect a new inbox, send and receive messages, periodic token refresh, webhook registration) now share the same API version and automatically retry with the alternate HTTP method when Meta swings between GET and POST. Silent failures on webhook subscribe/unsubscribe are now logged so the operator notices when something breaks.
    pt_BR: |-
      ### 🐛 Correções

      - **Integração com Instagram reforçada de ponta a ponta.** Todas as chamadas para a API do Instagram (conectar nova caixa, enviar e receber mensagens, renovação periódica de token, registro de webhooks) agora compartilham a mesma versão de API e automaticamente reentregam com o método HTTP alternativo quando o Meta alterna entre GET e POST. Falhas silenciosas no subscribe/unsubscribe de webhook agora aparecem nos logs para o operador perceber.
- tag: v4.13.0-auris.1.31.5
  published_at: '2026-06-19T15:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.5
  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting a new Instagram inbox finishes successfully.** Follow-up to the previous fix: the user-details step of the OAuth callback was pinned to an older Meta API version and started returning the same cryptic error. Pinned to the version the Meta App is configured for, and the inbox now finishes connecting.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de uma nova caixa de entrada do Instagram finaliza com sucesso.** Sequência da correção anterior: o passo de buscar os dados do usuário no callback do OAuth estava preso em uma versão antiga da API do Meta e passou a retornar o mesmo erro confuso. Atualizamos para a versão que o app no Meta está configurado e a caixa de entrada termina de conectar normalmente.
