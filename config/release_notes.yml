- tag: v4.15.1-auris.1.41.6
  published_at: '2026-07-12T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.6
  notes:
    en: |-
      ### 🐛 Fixes

      - **Ticket status now updates when the team changes it.** In My Tickets, the status badge was staying stuck on "Open" even after our team moved the ticket forward. Only the "Auris update" text was refreshing. Now both the badge and the text refresh live as soon as the team changes the status.
    pt_BR: |-
      ### 🐛 Correções

      - **Status do ticket agora atualiza quando o time muda.** Em Meus Tickets, o status estava travado em "Aberto" mesmo depois do nosso time avançar o ticket. Só o texto de "Atualização Auris" chegava. Agora o status e o texto atualizam sozinhos assim que o time muda o andamento.
