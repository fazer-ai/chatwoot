- tag: v4.13.0-auris.1.35.1
  published_at: '2026-06-25T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.35.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Instagram inboxes stay connected longer.** Some Instagram connections were dropping after a few hours and asking you to click "reconnect" even when nothing was wrong on Instagram's side. This no longer happens.
    pt_BR: |-
      ### 🐛 Correções

      - **Caixas Instagram permanecem conectadas por mais tempo.** Algumas conexões do Instagram caíam após poucas horas e pediam pra você clicar em "reconectar" mesmo sem nada errado do lado do Instagram. Isso não acontece mais.
- tag: v4.13.0-auris.1.35
  published_at: '2026-06-24T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.35
  notes:
    en: |-
      ### 🐛 Fixes

      - **WhatsApp coexistence: patient messages stop disappearing.** When the same number runs in the WhatsApp app and AurisChat together, some patient messages were silently dropped. Now they always appear in the conversation — when the original content can't be re-rendered, a note shows up telling the agent to check the WhatsApp app.
      - **Instagram inboxes stop disconnecting throughout the day.** The red "click to reconnect" banner used to appear on busy Instagram inboxes several times a day for harmless Meta hiccups. The system now waits for a real burst of errors before asking for a reconnect.
    pt_BR: |-
      ### 🐛 Correções

      - **WhatsApp coexistência: mensagens de paciente deixam de sumir.** Quando o mesmo número roda no aplicativo do WhatsApp e no AurisChat juntos, algumas mensagens de pacientes eram descartadas silenciosamente. Agora aparecem sempre na conversa — quando o conteúdo original não pode ser re-renderizado, surge um aviso pedindo pra ver a mensagem original no app do WhatsApp.
      - **Caixas do Instagram param de desconectar durante o dia.** O banner vermelho de "clique para reconectar" aparecia várias vezes ao dia em caixas movimentadas por causa de instabilidades pontuais da Meta. O sistema agora espera uma rajada real de erros antes de pedir reconexão.
- tag: v4.13.0-auris.1.34
  published_at: '2026-06-24T00:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.34
  notes:
    en: |-
      ### ⚡ Improvements

      - **The IA → Human report is now more reliable.** Every IA assignment is recorded the moment it happens, so the report no longer goes blank in busy periods. It also flags cases where the IA picked an agent that was already offline — making real issues easier to spot.

      Bug fixes and internal improvements.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O relatório IA → Humano ficou mais confiável.** Cada atribuição feita pela IA é registrada na hora, então o relatório não fica mais com falhas em momentos de muito movimento. Também passa a sinalizar quando a IA atribuiu uma conversa para um agente que já estava offline — facilita identificar problemas reais.

      Correções de bugs e melhorias internas.
