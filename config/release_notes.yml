- tag: v4.13.0-auris.1.24.5
  published_at: '2026-05-29T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.5
  notes:
    en: |-
      ### 🐛 Fixes

      - **Additional coverage on WhatsApp delivery confirmation.** Extra robustness around how delivery and read status updates are processed, so the correct status always shows up in the panel even in scenarios that escaped the previous round of fixes.
    pt_BR: |-
      ### 🐛 Correções

      - **Cobertura adicional na confirmação de entrega do WhatsApp.** Reforço no processamento das atualizações de status "entregue" e "lida", para que o status correto sempre apareça no painel mesmo em cenários que escaparam da rodada anterior de correções.
- tag: v4.13.0-auris.1.24.4
  published_at: '2026-05-28T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.4
  notes:
    en: |-
      ### 🐛 Fixes

      - **More reliable delivery confirmation on WhatsApp messages.** In some cases, messages sent by the agent would stay in "sent" status without progressing to "delivered" in the panel, even after reaching the customer. The handling of these status updates was hardened so the correct status always shows up.
    pt_BR: |-
      ### 🐛 Correções

      - **Confirmação de entrega das mensagens do WhatsApp mais consistente.** Em alguns cenários, mensagens enviadas pelo agente ficavam exibindo apenas o status "enviada" sem evoluir para "entregue" no painel, mesmo tendo chegado ao paciente. O processamento dessas atualizações foi reforçado para que o status correto sempre apareça.
- tag: v4.13.0-auris.1.24.3
  published_at: '2026-05-27T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.3
  notes:
    en: |-
      ### ⚡ Improvements

      - **Inline help on Health Score terms.** The Super Admin report now shows (?) icons next to each group (Outcomes / Operational / Engagement) and each metric, explaining what they measure and why they matter for churn risk.
      - **Health Score report no longer lists suspended accounts.** Ops now sees only active accounts in the report — suspended ones drop off the list until reactivated.

      ### 🐛 Fixes

      - **Duplicate WhatsApp contacts from the Brazilian "9th-digit" issue resolved.** When the same Brazilian number arrived in different formats (12 digits without the "9" and 13 digits with the "9"), Chatwoot used to create two separate contacts. The formats are now unified at the inbound message boundary, and existing duplicates consolidate automatically on the patient's next interaction.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Ajuda inline nos termos do Health Score.** No relatório do Super Admin, agora aparecem ícones (?) ao lado dos grupos (Outcomes / Operational / Engagement) e de cada métrica, explicando o que cada um mede e por que importa para o risco de churn.
      - **Relatório de Health Score sem o ruído de contas suspensas.** O Ops passa a ver apenas as contas ativas — contas suspensas somem da lista até serem reativadas.

      ### 🐛 Correções

      - **Contatos duplicados de WhatsApp por causa do "9º dígito" resolvido.** Quando o mesmo número brasileiro chegava em formatos diferentes (12 dígitos sem o "9" e 13 dígitos com o "9"), o Chatwoot criava dois contatos separados. Os formatos agora são unificados na entrada da mensagem, e os duplicados existentes se consolidam automaticamente na próxima interação do paciente.
- tag: v4.13.0-auris.1.24.2
  published_at: '2026-05-26T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.2
  notes:
    en: |-
      ### ⚡ Improvements

      - **Incoming WhatsApp messages processed with higher priority.** We tuned how WhatsApp webhooks are handled internally so real customer messages are picked up ahead of secondary events (typing indicators, delivery receipts, template/quality notifications), reducing delays during traffic spikes.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Mensagens recebidas do WhatsApp com mais prioridade no processamento.** Ajustamos como os webhooks de WhatsApp são tratados internamente para que mensagens reais dos clientes sejam atendidas antes de eventos secundários (indicador de digitação, recibos de leitura, notificações de template/qualidade), reduzindo atrasos em picos de tráfego.
- tag: v4.13.0-auris.1.24.1
  published_at: '2026-05-26T16:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.1
  notes:
    en: |-
      ### ⚡ Improvements

      - **Group chip and readable inbox list on the Health Score drill-down.** Each metric card in the expanded view of the Health Score report now shows a colored chip identifying its group (Outcomes / Operational / Engagement), and the Inbox uptime metric lists the phone numbers and connection state instead of the raw "[object Object]" placeholder.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Etiqueta de grupo e lista de inboxes legível no drill-down do Health Score.** Cada card de métrica na visão expandida do relatório Health Score agora mostra uma etiqueta colorida indicando o grupo (Outcomes / Operational / Engagement), e a métrica de uptime das inboxes lista os números de telefone com o status de conexão em vez do "[object Object]" anterior.
- tag: v4.13.0-auris.1.24
  published_at: '2026-05-25T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24
  notes:
    en: |-
      ### ✨ What's new

      - **Per-account Health Score report.** New **Reports → Health Score** entry in super admin with a 0-100 score per account and per group (Outcomes, Operational, Engagement). Colors flag churn risk at a glance (red / yellow / green) and clicking any row expands the 5 underlying metrics with raw values and the reason behind each missing metric. Snapshots are computed daily.
      - **Search accounts by ID in the sidebar switcher.** Beyond the name, the "Switch account" dropdown now also matches the account ID — handy when you already know the ID by heart.

      ### ⚡ Improvements

      - **Chat and campaign timestamps in the account language.** Message timestamps in the chat (including system activity messages) and dates on campaign cards now follow the account's configured language — Portuguese accounts see pt-BR copy, English accounts stay in English.
    pt_BR: |-
      ### ✨ Novidades

      - **Relatório de Health Score por conta.** Novo item **Relatórios → Health Score** no super admin com nota de 0 a 100 por conta e por grupo (Outcomes, Operational, Engagement). As cores sinalizam o risco de churn rapidamente (vermelho / amarelo / verde) e clicando em qualquer linha expande as 5 métricas que compõem a nota com valores brutos e a razão de cada métrica indisponível. Snapshots calculados diariamente.
      - **Buscar conta pelo ID no seletor da barra lateral.** Além do nome, o dropdown "Alterar conta" agora também casa pelo ID da conta — útil quando você já sabe o ID de cor.

      ### ⚡ Melhorias

      - **Datas do chat e das campanhas no idioma da conta.** O timestamp das mensagens no chat (incluindo as mensagens de atividade do sistema) e a data dos cards de campanha agora respeitam o idioma configurado da conta — em contas pt-BR aparecem em português, em contas em inglês continuam em inglês.
- tag: v4.13.0-auris.1.23.3
  published_at: '2026-05-25T01:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.23.3
  notes:
    en: |-
      ### 🐛 Fixes

      - **Automation activity messages now match the account language.** Activity entries triggered by automation rules (assignment, team, label, AI status changes) were always rendered in English, even on Portuguese accounts. They now follow the account's configured language.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens de atividade das automações no idioma da conta.** Os eventos gerados por regras de automação (atribuição, time, etiquetas, mudança de status da IA) apareciam sempre em inglês, mesmo em contas configuradas em português. Agora respeitam o idioma da conta.
- tag: v4.13.0-auris.1.23.2
  published_at: '2026-05-24T23:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.23.2
  notes:
    en: |-
      ### 🐛 Fixes

      - **Automation rules with "AI status = AI Disabled" stay saved.** Saving a rule with the new "AI Disabled" condition was silently losing the value on save — reopening the rule showed an empty dropdown and the trigger never fired. The condition now persists and the rule triggers correctly.
