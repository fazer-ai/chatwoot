      - **Nome da fase do funil sem espaços sobrando.** A fase "Comparecimento (ganho)" e o KPI equivalente no relatório de Conversão não têm mais espaços extras dentro dos parênteses.
- tag: v4.13.0-auris.1.22.1
  published_at: '2026-05-23T14:00:00Z'
