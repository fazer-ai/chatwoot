  published_at: '2026-06-22T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.32
  notes:
    en: |-
      ### ✨ What's new

      - **Auris Notification Center.** The Auris team can now send you announcements (maintenance, news) directly inside the panel. When there's something to read, a window pops up and stays until you click "I understand". You can revisit the 10 most recent notices any time from the new "Notification Center" menu.
