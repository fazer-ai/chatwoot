  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.4
  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting a new Instagram inbox works again.** The OAuth callback was failing during the long-lived token exchange because Meta's Instagram Business Login now returns a long-lived token directly, with no exchange step needed. AurisChat skips the legacy exchange in that case and the inbox finishes connecting cleanly.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de nova caixa de entrada do Instagram voltou a funcionar.** O callback do OAuth falhava na troca para o token de longa duração porque o Instagram Business Login do Meta passou a entregar o token já longo direto, sem precisar de troca. O AurisChat agora pula essa etapa quando ela não é necessária e a caixa de entrada conecta normalmente.
