- tag: v4.13.0-auris.1
  published_at: '2026-04-29T02:35:31Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1
  notes:
    en: |-
      > Includes changes from Chatwoot fazer.ai v4.13.0-fazer-ai.61.

      ### ✨ What's new

      - **New "Manager" role.** A new role between agent and administrator: managers see all reports and can configure existing inboxes (including reconnecting WhatsApp Baileys via QR code), on top of everything an agent does. They cannot create or delete inboxes — those actions remain restricted to administrators.

      ### ⚡ Improvements

      - **auris.ia.br branding.** New logos and the auris.ia.br brand replace the previous fazer.ai branding across the product (login footer, build info, help links, in-app references).
      - **Kanban and Captain menus hidden.** These items were removed from the sidebar.
    pt_BR: |-
      > Inclui mudanças do Chatwoot fazer.ai v4.13.0-fazer-ai.61.

      ### ✨ Novidades

      - **Novo perfil "Gerente".** Um perfil intermediário entre agente e administrador: gerentes têm acesso a todos os relatórios e podem configurar caixas de entrada existentes (incluindo reconectar canais WhatsApp Baileys via QR code), além de tudo que um agente faz. Não conseguem criar nem excluir caixas — essas ações continuam restritas a administradores.

      ### ⚡ Melhorias

      - **Identidade visual auris.ia.br.** Novos logos e a marca auris.ia.br substituem a marca fazer.ai em todo o produto (rodapé do login, informações de build, links de ajuda, referências internas).
      - **Menus Kanban e Captain ocultados.** Esses itens foram removidos do menu lateral.
