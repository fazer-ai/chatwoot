- tag: v4.15.1-auris.1.41.4
  published_at: '2026-07-12T18:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.4
  notes:
    en: |-
      ### ⚡ Improvements

      - **My Tickets updates in real time from our team.** The connection that carries our team's updates had an issue. Now, when someone on the team changes a ticket's status or writes a response, the list and the ticket window refresh live in your panel.

      ### 🐛 Fixes

      - **"Send feedback" button is blue again.** In the dialog that opens when you click the flag icon next to a message, the "Send feedback" button was showing only the outline. Now it's solid blue like the other primary buttons.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Meus Tickets atualiza em tempo real com o retorno do time.** A conexão que traz as atualizações do nosso time estava com problema. Agora, quando alguém do time muda o status de um ticket ou escreve uma resposta, a lista e a janela do ticket atualizam sozinhas no seu painel.

      ### 🐛 Correções

      - **Botão "Enviar feedback" volta a ficar azul.** Na janela que abre quando você clica na bandeirinha ao lado de uma mensagem, o botão "Enviar feedback" estava aparecendo só com o contorno. Agora fica azul sólido igual aos outros botões principais.
- tag: v4.15.1-auris.1.41.3
  published_at: '2026-07-12T02:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.3
  notes:
    en: |-
      ### ✨ What's new

      - **"Hide closed" checkbox on My Tickets.** Check the box and closed tickets disappear from the list, leaving only what still needs follow-up.

      ### ⚡ Improvements

      - **My Tickets looks cleaner.** New "ID" column, ordered by ID (newest first), and the table matches the style of other list pages. Ticket detail shows the status with the same colored badge as the list.
      - **Simpler status.** The panel used to show 7 ops-team categories. Now you see only 3: Open, In review, Closed.
      - **"Add more information" hides when it makes sense.** Field disappears on closed tickets — no more sending comments nobody will read.

      ### 🐛 Fixes

      - **Menu labels back to normal.** Sidebar was showing technical text ("SIDEBAR.CONVERSATIONS" etc.) instead of the translated names. Everything reads correctly now.
      - **Ticket details open with the full content.** Clicking a ticket used to open an almost-empty modal. Now it opens with every field.
      - **"In review" badge has its blue background.**
    pt_BR: |-
      ### ✨ Novidades

      - **Caixinha "Ocultar finalizadas" em Meus Tickets.** Marca a caixinha e os tickets encerrados somem da lista, deixando só o que ainda precisa acompanhamento.

      ### ⚡ Melhorias

      - **Meus Tickets ficou mais limpo.** Nova coluna "ID" no começo, ordenação por ID (do mais novo pro mais antigo) e a tabela ganhou o mesmo estilo do resto do painel. O detalhe do ticket também mostra o status com a mesma cor da lista.
      - **Status simplificado.** Antes aparecia as 7 categorias que o time interno usa. Agora só 3: Aberto, Em análise e Encerrado.
      - **"Adicionar mais informação" só quando faz sentido.** O campo some quando o ticket já foi encerrado — evita mandar comentário que ninguém vai olhar.

      ### 🐛 Correções

      - **Nomes do menu voltaram ao normal.** A barra lateral estava mostrando textos técnicos ("SIDEBAR.CONVERSATIONS" etc.). Tudo aparece certo agora.
      - **Detalhes do ticket abrem completos.** Antes clicar num ticket abria uma janela quase vazia — só o cabeçalho. Agora aparece com todos os campos.
      - **Badge "Em análise" com fundo azul.**
- tag: v4.15.1-auris.1.41.2
  published_at: '2026-07-11T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.2
  notes:
    en: |-
      ### ✨ What's new

      - **My Tickets: track the feedback you sent and hear back from the team.** A new "My Tickets" item shows up in the sidebar with every feedback you opened. Each row shows the status; clicking one opens a panel with the team's response and a button to jump back to the message you flagged. When the team updates a ticket you see a notification right away.

      ### ⚡ Improvements

      - **Warmer wording on the feedback button.** The flag icon on messages now reads "Send feedback", and the modal focuses on helping your assistant get better instead of reporting a problem.
    pt_BR: |-
      ### ✨ Novidades

      - **Meus Tickets: acompanhe seus feedbacks e o retorno do time.** Um novo item "Meus Tickets" aparece na barra lateral com a lista dos feedbacks que você abriu. Cada linha mostra o status; clicando abre um painel com o retorno do nosso time e um botão pra voltar direto pra mensagem que você comentou. Quando o time atualiza um ticket você recebe um aviso na hora.

      ### ⚡ Melhorias

      - **Textos mais leves ao dar feedback.** O botão de bandeirinha nas mensagens agora diz "Dar feedback" e o modal foca em ajudar a evoluir a sua secretária, não em reportar problema.
- tag: v4.15.1-auris.1.41.1
  published_at: '2026-07-11T17:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Downloading the conversation transcript as a PDF now works.** Since the button was released, clicking "Download transcript (PDF)" ended with "Could not generate the transcript PDF. Try again." The file now downloads on the first click.
    pt_BR: |-
      ### 🐛 Correções

      - **Baixar transcrição da conversa em PDF agora funciona.** Desde que o botão foi lançado, clicar em "Baixar transcrição (PDF)" terminava em "Não foi possível gerar o PDF da transcrição. Tente novamente." O arquivo agora baixa direto no primeiro clique.
- tag: v4.15.1-auris.1.41
  published_at: '2026-07-10T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41
  notes:
    en: |-
      ### ✨ What's new

      - **Report an issue on a response.** Hover any AI or agent message and a flag icon appears next to the reactions. Click it to describe what went wrong, suggest the correct answer, and attach screenshots. The team receives the report and follows up.

      - **Managers can delete contacts.** Users with the "manager" role can now delete contacts directly — this used to be admin-only.

      ### 🐛 Fixes

      - **Renaming an inbox now works on the first try.** Editing an inbox name showed a confusing warning and only saved on the retry. It now saves on the first click.
    pt_BR: |-
      ### ✨ Novidades

      - **Relatar problema em uma resposta.** Passe o mouse por cima de qualquer mensagem da IA ou do agente e aparece um ícone de bandeira ao lado das reações. Um clique abre uma janela para descrever o que aconteceu, sugerir a resposta correta e anexar prints. O time recebe o relato e volta com o retorno.

      - **Gestor pode excluir contatos.** Usuários com papel de "gestor" agora conseguem apagar um contato direto — antes só administradores tinham.

      ### 🐛 Correções

      - **Renomear caixa de entrada agora funciona na primeira tentativa.** Editar o nome de uma caixa mostrava um aviso confuso e só salvava na segunda tentativa. Agora salva de primeira.
