- tag: v4.15.1-auris.1.41.9
  published_at: '2026-07-13T18:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.9
  notes:
    en: |-
      ### ✨ What's new

      - **Feedback ticket detail is now a full conversation timeline.** Every reply from the support team and every extra note you add appears as a row with the date, who wrote it, and the message.

      ### ⚡ Improvements

      - **"What should have happened?" is required when opening a ticket.** Support always gets both sides of the story so investigation is faster.
    pt_BR: |-
      ### ✨ Novidades

      - **Detalhes do ticket agora mostram a conversa completa.** Toda resposta do time e toda informação extra que você adiciona aparecem em linhas com data, quem escreveu e a mensagem.

      ### ⚡ Melhorias

      - **"Qual deveria ter sido a resposta?" virou obrigatório ao abrir o ticket.** O time de suporte sempre recebe os dois lados pra investigar mais rápido.
- tag: v4.15.1-auris.1.41.8
  published_at: '2026-07-13T02:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.8
  notes:
