  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting a new Instagram inbox keeps working even when Meta swings.** Meta has been flipping which HTTP method it accepts on the Instagram token exchange daily. The integration now retries automatically with the other method when that happens, so adding an inbox is no longer interrupted by Meta's flip-flopping.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de nova caixa de entrada do Instagram resiste às oscilações do Meta.** O Meta tem alternado diariamente qual método HTTP aceita na troca de token do Instagram. A integração agora tenta automaticamente com o outro método quando isso acontece, então adicionar uma caixa de entrada não é mais interrompido pelas oscilações do Meta.
