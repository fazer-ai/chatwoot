- tag: v4.13.0-auris.1.24.7
  published_at: '2026-05-30T15:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.7
  notes:
    en: |-
      ### ✨ What's new

      - **Unconfirmed-message rate in the Inbox status report (Super Admin).** The inbox status page got a new column showing the share of outgoing messages in the last 24 hours that didn't get a confirmation from the WhatsApp provider, with a green/yellow/red chip so it's easy to spot which inboxes are having delivery trouble.

      ### ⚡ Improvements

      - **More reliable WhatsApp delivery on cold conversations.** When a message doesn't reach the patient because the WhatsApp session had been quiet for hours or days, the system now detects it, refreshes the connection automatically and retries — most of these cases get delivered without the operator having to resend.

      ### 🐛 Fixes

      - **Undelivered WhatsApp messages now show as failed.** Previously some sends would fail silently and stay marked as "sent" in the panel even though they never reached the patient. Now, when the provider doesn't confirm receipt of the message, it shows as failed with the red indicator — so you know to resend.
    pt_BR: |-
      ### ✨ Novidades

      - **Indicador de mensagens não confirmadas no relatório de Inboxes (Super Admin).** A página de status de inboxes ganhou uma coluna nova mostrando a porcentagem de mensagens enviadas nas últimas 24h que ficaram sem confirmação do provedor de WhatsApp, com chip verde/amarelo/vermelho pra identificar de cara quais caixas estão com problema de entrega.

      ### ⚡ Melhorias

      - **Mensagens WhatsApp mais confiáveis em conversas frias.** Quando uma mensagem não chega ao paciente porque a conversa estava parada há horas ou dias, o sistema agora detecta, refresca a conexão automaticamente e tenta de novo — a maioria desses casos passa a ser entregue sem o operador precisar reenviar.

      ### 🐛 Correções

      - **Mensagens WhatsApp não entregues agora aparecem como erro.** Antes, alguns envios falhavam silenciosamente e ficavam exibindo "enviada" no painel mesmo sem chegar ao paciente. Agora, quando o provedor não confirma o recebimento da mensagem, ela aparece como falha com o indicador vermelho — assim você sabe que precisa reenviar.
- tag: v4.13.0-auris.1.24.6
  published_at: '2026-05-29T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.6
  notes:
    en: |-
      ### 🐛 Fixes

      - **WhatsApp message delivery to contacts with older accounts.** In some cases, messages sent by the agent were marked as sent but didn't reach the recipient when the contact's WhatsApp account had been registered years ago. The routing was adjusted so these messages get delivered again.
    pt_BR: |-
      ### 🐛 Correções

      - **Entrega de mensagens WhatsApp para contatos com conta antiga.** Em alguns cenários, mensagens enviadas pelo agente eram marcadas como enviadas mas não chegavam ao destinatário quando a conta de WhatsApp dele tinha sido registrada há vários anos. O roteamento foi ajustado e essas mensagens voltam a ser entregues normalmente.
- tag: v4.13.0-auris.1.24.5
  published_at: '2026-05-29T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.24.5
  notes:
    en: |-
      ### 🐛 Fixes

      - **Additional coverage on WhatsApp delivery confirmation.** Extra robustness around how delivery and read status updates are processed, so the correct status always shows up in the panel even in scenarios that escaped the previous round of fixes.
    pt_BR: |-
      ### 🐛 Correções

      - **Cobertura adicional na confirmação de entrega do WhatsApp.** Reforço no processamento das atualizações de status "entregue" e "lida", para que o status correto sempre apareça no painel mesmo em cenários que escaparam da rodada anterior de correções.
