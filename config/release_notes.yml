  published_at: '2026-05-14T00:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.17
  notes:
    en: |-
      ### ⚡ Improvements

      - **Webhook improvements.** Webhook payloads now carry extra account context alongside each event, making external integrations (n8n, Zapier, etc.) easier to wire up.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Melhorias nos webhooks.** Os webhooks agora carregam mais informações de contexto da conta junto com cada evento, facilitando integrações externas (n8n, Zapier, etc.).
- tag: v4.13.0-auris.1.16
  published_at: '2026-05-13T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.16
  notes:
    en: |-
      ### ⚡ Improvements

      - **Refreshed Baileys status report.** The Super Admin Baileys inbox status page now follows the same layout and palette as the dashboard reports, with Total / Connected / Disconnected cards at the top, redesigned filters, and a polished table.
      - **Sturdier custom attribute editing.** While editing a custom attribute value, you can now click-and-drag to select text without the editor closing, and the content auto-saves when you click outside.

      ### 🐛 Fixes

      - **Conversation activity messages stay visible.** Bubbles like "Conversation resolved", "Reopened", agent assignment, priority change, and AI toggle now persist in the chat after you leave the conversation and come back — previously the state itself was kept but the activity bubble disappeared.
      - **Z-API contacts no longer get stamped with the agent's name.** When the first message in a chat is sent from outside Chatwoot (e.g. n8n flows hitting Z-API directly), the new contact is now identified by phone instead of being named after the WhatsApp instance owner. As soon as the customer replies for the first time, their real WhatsApp profile name is filled in automatically — fixing both new and previously-polluted contacts.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Relatório de status Baileys repaginado.** A página de status dos canais Baileys no Super Admin agora segue o mesmo visual dos relatórios do dashboard, com cards de Total / Conectado / Desconectado no topo, filtros redesenhados e tabela na paleta padrão.
      - **Edição de atributos personalizados mais robusta.** Ao editar o valor de um atributo personalizado, agora você pode selecionar texto com clique-e-arrasta sem o editor fechar, e o conteúdo é salvo automaticamente ao clicar fora.

      ### 🐛 Correções

      - **Atividades da conversa permanecem visíveis.** Balões como "Conversa marcada como resolvida", "Reaberta", atribuição de agente, troca de prioridade e troca da IA voltam a permanecer no chat depois que você sai da conversa e volta — antes, o status persistia mas o balão da atividade sumia.
      - **Contatos Z-API não recebem mais o nome do agente.** Quando a primeira mensagem é disparada de fora do Chatwoot (ex.: fluxos no n8n chamando a Z-API direto), o novo contato passa a ser identificado pelo telefone em vez de herdar o nome do dono da instância WhatsApp. Assim que o paciente responder pela primeira vez, o nome real do WhatsApp dele é preenchido automaticamente — corrigindo tanto contatos novos quanto contatos já contaminados.
- tag: v4.13.0-auris.1.15
  published_at: '2026-05-12T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.15
  notes:
    en: |-
      ### ✨ What's new

      - **Personal or global visibility for custom filters.** Every contact or conversation filter can now be marked Personal (only you see it) or Global (visible to everyone on the team).
      - **Patient language on contacts.** You can set each contact's language (Portuguese, English, Spanish, or French) right on the contact card.

      ### ⚡ Improvements

      - **Cleaner variables picker on WhatsApp campaigns.** The `{{agent.*}}` tokens no longer appear when filling campaign variables — campaigns are sent by the bot, so those tokens never resolved meaningfully there and just cluttered the list.
      - **New inboxes default to "Reopen the same conversation".** Matches the Auris standard for WhatsApp/SMS-style channels. You can switch it off per inbox in the inbox settings if you prefer the old behavior.
      - **Faster WhatsApp processing under instability.** Contact profile pictures and group avatars now load in the background, keeping message processing snappy when WhatsApp itself is flaky.

      ### 🐛 Fixes

      - **Contact filters respect contacts created in real time.** A brand-new contact (or one arriving through a message) now correctly appears in or disappears from your list according to the filters you have applied.
      - **Small Portuguese translation fixes** across the WhatsApp setup flow.
    pt_BR: |-
      ### ✨ Novidades

      - **Visibilidade pessoal ou global em filtros personalizados.** Cada filtro de contatos ou de conversas agora pode ser marcado como *Pessoal* (só você vê) ou *Global* (visível para toda a equipe).
      - **Idioma do paciente no contato.** Você pode definir o idioma de cada contato (Português, Inglês, Espanhol ou Francês) diretamente no card do contato.

      ### ⚡ Melhorias

      - **Picker de variáveis em campanhas WhatsApp mais limpo.** Os tokens `{{agent.*}}` não aparecem mais ao montar variáveis de campanha — campanhas são disparadas pelo robô, então esses tokens nunca faziam sentido ali e só poluíam a lista.
      - **Caixas de entrada novas começam com "Reabrir a mesma conversa" ativado.** Padrão Auris para canais de WhatsApp/SMS. Você pode desativar individualmente nas configurações de cada caixa, se preferir o comportamento antigo.
      - **WhatsApp mais rápido em momentos de instabilidade.** Fotos de perfil de contatos e avatares de grupos agora carregam em segundo plano, evitando travamentos no processamento de mensagens durante oscilações da própria WhatsApp.

      ### 🐛 Correções

      - **Filtros de contato respeitam contatos criados em tempo real.** Um contato novo (ou recebido por mensagem) agora aparece ou some da lista corretamente conforme os filtros aplicados.
      - **Pequenas correções de tradução em português** no fluxo de configuração do WhatsApp.
