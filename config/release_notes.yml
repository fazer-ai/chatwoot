  published_at: '2026-06-18T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.31.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting a new Instagram inbox works again.** Meta flipped the accepted HTTP method on the Instagram token exchange endpoint, breaking the "Failed to exchange token" dialog when adding an Instagram inbox. Fixed.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de uma nova caixa de entrada do Instagram voltou a funcionar.** O Meta mudou o método HTTP aceito no endpoint de troca de token do Instagram, quebrando o passo final com a mensagem "Failed to exchange token". Corrigido.
