- tag: v4.13.0-auris.1.28
  published_at: '2026-06-17T03:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.28
  notes:
    en: |-
      ### 🐛 Fixes

      - **Replies that kept failing for certain patients now work.** Some patient conversations were stuck with "Failed to send" on every attempt, even though the patient could still write to the clinic. AurisChat now fixes the patient's data automatically the moment they send the next message, so you can keep the conversation going normally.
    pt_BR: |-
      ### 🐛 Correções

      - **Respostas que ficavam falhando pra alguns pacientes voltaram a funcionar.** Algumas conversas ficavam travadas com "Falha ao enviar" toda vez que você tentava responder, mesmo o paciente conseguindo escrever pra clínica. O AurisChat agora corrige os dados do paciente automaticamente assim que ele mandar a próxima mensagem, e você consegue continuar a conversa normalmente.
- tag: v4.13.0-auris.1.27.1
  published_at: '2026-06-16T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.27.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Connecting an Instagram inbox works again.** The "Failed to exchange token" error that appeared when adding a new Instagram inbox is fixed.
    pt_BR: |-
      ### 🐛 Correções

      - **Conexão de inbox do Instagram voltou a funcionar.** O erro "Failed to exchange token" que aparecia ao adicionar uma inbox nova de Instagram foi corrigido.
- tag: v4.13.0-auris.1.27
  published_at: '2026-06-16T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.13.0-auris.1.27
  notes:
    en: |-
      ### ⚡ Improvements

      - **WhatsApp keeps up better when things are busy.** Patient messages arrive faster even when there's a lot of delivery and read confirmations coming in at the same time — they no longer have to wait in line behind those.

      ### 🐛 Fixes

      - **The checkmark color of a sent message doesn't rewind anymore.** Before, the message marker could turn blue (the patient read) and briefly go back to gray, making it look like the patient hadn't seen it yet. Now once it shows the patient read, it stays that way.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O WhatsApp acompanha melhor o ritmo quando está cheio.** As mensagens dos pacientes chegam mais rápido mesmo quando vêm muitas confirmações de entrega e leitura ao mesmo tempo — elas não precisam mais esperar atrás dessas confirmações.

      ### 🐛 Correções

      - **O check de mensagem enviada não volta atrás.** Antes, o marcador podia ficar azul (paciente leu) e voltar pra cinza por um instante, dando a impressão de que ele ainda não tinha visto. Agora, depois que aparece como lido, fica desse jeito.
