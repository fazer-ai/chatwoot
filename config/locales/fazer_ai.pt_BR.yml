# fazer.ai fork translations.
#
# Rails deep-merges every config/locales/*.yml, so these keys land on top of
# upstream's <locale>.yml without touching it. Keys for our own features go
# here; upstream copy we merely translate does not.
#
# Adding a language means adding fazer_ai.<locale>.yml. Nothing else changes.
pt_BR:
  internal_chat:
    default_category_name: Canais
    default_channel_name: Geral
    messages:
      deleted: Esta mensagem foi excluída
  errors:
    automation:
      scheduled_message:
        delay_out_of_range: O atraso deve ser entre 1 minuto e 999 dias
        content_attachment_or_template_required: A mensagem agendada deve ter conteúdo, anexo ou template
    scheduled_messages:
      cannot_delete_processed: Não é possível excluir uma mensagem agendada que já foi enviada ou falhou
    conversations:
      already_assigned: "%{agent_name} já está atendendo esta conversa."
    conversation_pins:
      limit_reached: Você pode fixar no máximo %{limit} conversas.
      conversation_resolved: Não é possível fixar uma conversa resolvida.
      conversation_not_visible: Esta conversa não está na sua lista, então não pode ser fixada.
    whatsapp:
      group_announcement_only: Somente administradores podem enviar mensagens neste grupo
    inboxes:
      channel:
        provider_unavailable: Este provedor de WhatsApp ainda não está disponível nesta instalação.
        invalid_provider_config: 'Configuração inválida em: %{keys}'
        provider_not_enabled_for_account: Este provedor de WhatsApp está desativado para esta conta.
        provider_withdrawn: Este provedor de WhatsApp não é mais oferecido para novas caixas de entrada. As caixas que já usam ele continuam funcionando.
        cannot_unpair: Este provedor não consegue desvincular a conta do WhatsApp pareada com ele, então conectar de novo retomaria a mesma conta. Reinicie a instância no provedor, aponte esta caixa de entrada para outra, ou corrija o número configurado aqui.
        code_pairing_unsupported: Este provedor do WhatsApp não consegue parear com código. Escaneie o QR Code no lugar.
        provider_connection:
          wrong_phone_number: O número de telefone que você está tentando conectar não é o mesmo que o configurado. Certifique-se de que o número está correto antes de escanear o QR code.
          reconnect_loop_detected: Não foi possível restabelecer a conexão após várias tentativas. Novas tentativas automáticas continuam em intervalos crescentes. Se o problema persistir, desconecte a caixa de entrada e conecte novamente escaneando um novo QR code.
          invalid_credentials: O provedor recusou as credenciais desta caixa de entrada. Confira o endereço e o token e tente novamente.
          logged_out: Este dispositivo foi desconectado do WhatsApp pelo celular. Conecte novamente para continuar recebendo mensagens.
          stream_replaced: Esta sessão foi substituída por outra conexão da mesma conta do WhatsApp. Conecte novamente para usar aqui.
          temporary_ban: O WhatsApp bloqueou temporariamente este número. Aguarde o fim do bloqueio antes de conectar novamente.
          client_outdated: O conector do WhatsApp está desatualizado e não consegue mais conectar. Atualize-o para restabelecer a conexão.
          quarantined: Muitas tentativas de reconexão falharam seguidas. Novas tentativas continuam em intervalos crescentes.
          connector_unavailable: O conector do WhatsApp não está respondendo. As mensagens só voltarão a ser enviadas quando ele retornar.
          connector_incompatible: A versão do conector do WhatsApp é incompatível com esta versão do Chatwoot. Atualize o conector.
          connect_failure: O WhatsApp recusou a conexão. Novas tentativas continuam automaticamente.
          pairing_timed_out: O código expirou antes de o telefone concluir o pareamento. Inicie a conexão novamente para obter um novo.
  notifications:
    notification_title:
      internal_chat_mention: Você foi mencionado em %{name}
      internal_chat_new_message: Nova mensagem de %{name}
  conversations:
    activity:
      group_participants:
        add:
          single: "%{author_name} adicionou %{contact_name} ao grupo"
          multiple: "%{author_name} adicionou %{contact_names} e %{last_contact_name} ao grupo"
        join: "%{contact_name} entrou usando o link do grupo"
        leave: "%{contact_name} saiu do grupo"
        remove:
          single: "%{author_name} removeu %{contact_name} do grupo"
          multiple: "%{author_name} removeu %{contact_names} e %{last_contact_name} do grupo"
        promote:
          single: "%{author_name} promoveu %{contact_name} a admin"
          multiple: "%{author_name} promoveu %{contact_names} e %{last_contact_name} a admin"
        demote:
          single: "%{author_name} rebaixou %{contact_name} a membro"
          multiple: "%{author_name} rebaixou %{contact_names} e %{last_contact_name} a membro"
      groups_update:
        subject_changed: '%{author_name} alterou o nome do grupo para "%{value}"'
        description_changed: "%{author_name} alterou a descrição do grupo"
        description_removed: "%{author_name} removeu a descrição do grupo"
        restrict_enabled: "%{author_name} mudou as configurações para permitir que somente admins editem as configurações do grupo"
        restrict_disabled: "%{author_name} mudou as configurações para permitir que todos os membros editem as configurações do grupo"
        announce_enabled: "%{author_name} mudou as configurações desse grupo para permitir que somente admins enviem mensagens ao grupo"
        announce_disabled: "%{author_name} mudou as configurações do grupo para permitir que todos os membros enviem mensagens"
        member_add_mode_enabled: "%{author_name} mudou as configurações do grupo para permitir que todos os membros adicionem outras pessoas"
        member_add_mode_disabled: "%{author_name} mudou as configurações deste grupo para permitir que somente admins adicionem outras pessoas ao grupo"
        join_approval_mode_enabled: "%{author_name} ativou a autorização de admins para entrar neste grupo"
        join_approval_mode_disabled: "%{author_name} desativou a autorização de admins para entrar neste grupo"
        invite_link_reset: "%{author_name} redefiniu o link do grupo para convidar outras pessoas"
        unknown_author: Alguém
        membership_request_created: "%{contact_name} deseja entrar no grupo"
        membership_request_revoked: "%{contact_name} não deseja mais fazer parte do grupo"
        icon_changed: "%{author_name} alterou a imagem do grupo"
      recurring_message_failed: Mensagem agendada recorrente falhou ao enviar. Próxima ocorrência agendada para %{next_date}.
      recurring_message_completed: Série de mensagem agendada recorrente concluída após %{count} ocorrências.
      recurring_message_cancelled: Recorrência de mensagem agendada foi interrompida por %{agent}.
      unknown_agent: Desconhecido
  contacts:
    sync_group:
      not_a_group: O contato não é um grupo
      no_identifier: O contato não possui um identificador de grupo
      no_supported_inbox: Nenhuma caixa de entrada com suporte a sincronização de grupo encontrada para este contato
      metadata_unavailable: Não foi possível obter os metadados do grupo do provedor
  recurring_scheduled_messages:
    description:
      daily:
        one: Todos os dias
        other: A cada %{count} dias
      weekly:
        one: Semanal
        other: A cada %{count} semanas
      weekly_on: "%{prefix}: %{days}"
      monthly:
        one: Mensal
        other: A cada %{count} meses
      monthly_on_weekday: "%{prefix} no(a) %{ordinal} %{weekday}"
      yearly:
        one: Anual
        other: A cada %{count} anos
      until_date: até %{date}
      after_count:
        one: "%{count} ocorrência"
        other: "%{count} ocorrências"
      ordinals:
        first: primeiro(a)
        second: segundo(a)
        third: terceiro(a)
        fourth: quarto(a)
        fifth: quinto(a)
        last: último(a)
