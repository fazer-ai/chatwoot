default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('POSTGRES_HOST', 'localhost') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5432') %>
<%
  # ref: https://github.com/mperham/sidekiq/issues/2985#issuecomment-531097962
  pool_size = Sidekiq.server? ? ENV.fetch('SIDEKIQ_CONCURRENCY', 10).to_i : ENV.fetch('RAILS_MAX_THREADS', 5).to_i
  # The WhatsApp connector's event consumer runs one thread per shard inside Sidekiq, and
  # every one of them writes to the database. They are not Sidekiq workers, so nothing
  # else counts them here, and without the room they cannot check a connection out.
  if Sidekiq.server? && ENV.fetch('WHATSAPP_CONNECTOR_ENABLED', 'false') == 'true' &&
     ENV.fetch('WHATSAPP_CONNECTOR_CONSUMER', 'sidekiq') == 'sidekiq'
    pool_size += ENV.fetch('WHATSAPP_CONNECTOR_EVENT_SHARDS', 8).to_i
  end
%>
  pool: <%= pool_size %>
  # frequency in seconds to periodically run the Reaper, which attempts
  # to find and recover connections from dead threads
  reaping_frequency: <%= ENV.fetch('DB_POOL_REAPING_FREQUENCY', 30) %>
  checkout_timeout: <%= ENV.fetch('DB_CHECKOUT_TIMEOUT', 5) %>
  variables:
    # we are setting this value to be close to the racktimeout value. we will iterate and reduce this value going forward
    statement_timeout: <%= ENV["POSTGRES_STATEMENT_TIMEOUT"] || "14s" %>

development:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_dev') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"

test:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_test') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"

production:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_production') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'chatwoot_prod') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', 'chatwoot_prod') %>"
