type: object
properties:
  id:
    type: integer
    description: Internal ID of the funnel stage
  name:
    type: string
    description: Display name shown on the board column header.
  description:
    type:
      - string
      - 'null'
    description: Free-form description shown as a tooltip on the board column header.
  position:
    type: integer
    description: Left-to-right ordering on the board. Lower numbers appear first.
  closed:
    type: boolean
    description: True for terminal stages. Conversations whose stage is closed are hidden when the request asks for hide_closed=true.
  active:
    type: boolean
    description: Disabled stages are skipped from the board and from move operations.
  color:
    type: string
    description: Hex color used to render the column header on the board.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
