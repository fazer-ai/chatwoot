tags:
  - Funnel
operationId: create-funnel-stage
summary: Create a funnel stage
description: |
  Creates a new funnel stage. Reserved for administrators and managers.
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [funnel_stage]
        properties:
          funnel_stage:
            type: object
            required: [name, position, color]
            properties:
              name:
                type: string
                example: Novo Contato
              description:
                type: string
                example: Primeiro contato recebido
              position:
                type: integer
                example: 0
              closed:
                type: boolean
                default: false
              active:
                type: boolean
                default: true
              color:
                type: string
                description: Hex color used to render the column header on the board.
                example: '#6b7280'
              requires_loss_reason:
                type: boolean
                description: Set to true to force operators to pick a `loss_reason_id` when moving conversations into this stage.
                default: false
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/funnel_stage'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
