tags:
  - Funnel
operationId: move-funnel-conversation
summary: Move a conversation to a stage
description: |
  Updates `conversations.funnel_stage_id` to the requested stage and writes a row to the audit table inside a single transaction. Cycle is incremented automatically when the conversation re-enters a stage it has visited before. After the move succeeds, a `funnel_updated` webhook event is dispatched to subscribers.

  Any role can move (administrator, manager, agent). Pass a `source` to identify the integration calling the endpoint (e.g. `n8n`); when authenticated as a session user, the audit row also captures the `user_id`.
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [conversation_id, stage]
        properties:
          conversation_id:
            type: integer
            description: Conversation `display_id`
            example: 42
          stage:
            type: string
            description: Target stage `name` (must match an active funnel stage).
            example: Confirmado
          reason:
            type: string
            description: Optional human-readable note saved on the audit row.
            example: Paciente confirmou pelo WhatsApp.
          source:
            type: string
            description: Identifier of where the move came from. Defaults to 'web' when omitted by the dashboard.
            example: n8n
          loss_reason_id:
            type: integer
            description: 'Required when the target stage has requires_loss_reason set to true (e.g. Perdido). Must reference an active loss_reason.'
            example: 1
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            payload:
              type: object
              properties:
                conversation_id:
                  type: integer
                  description: Conversation `display_id`
                previous_stage:
                  type:
                    - string
                    - 'null'
                new_stage:
                  type: string
                change:
                  $ref: '#/components/schemas/funnel_stage_change'
  '400':
    description: Stage is not active or required parameter missing
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Conversation not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Target stage requires a loss_reason_id, or the supplied loss_reason_id is invalid
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
