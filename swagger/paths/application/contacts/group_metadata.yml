parameters:
  - $ref: '#/components/parameters/account_id'
  - name: id
    in: path
    required: true
    schema:
      type: number
    description: ID of the group contact
  - name: inbox_id
    in: query
    required: false
    schema:
      type: number
    description: >-
      Which inbox the action is performed as. A group contact is account-scoped, so the
      same WhatsApp group can belong to two inboxes of one account. Optional while a
      group is in a single inbox; required once it is in more than one, since there is
      otherwise no way to tell which number should act. An inbox the group is not in, or
      one the caller is not a member of, is refused. Accepted in the request body as well
      as on the query string.

patch:
  tags:
    - Groups
  operationId: contact-group-metadata-update
  summary: Update Group Metadata
  description: Updates the group subject and/or description via the WhatsApp provider. At least one of subject or description must be provided.
  security:
    - userApiKey: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            subject:
              type: string
              description: New group subject (name)
            description:
              type: string
              description: New group description
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: number
                description: ID of the contact
              name:
                type: string
                description: Updated name of the contact
              additional_attributes:
                type: object
                description: Additional attributes of the contact
    '401':
      description: Unauthorized
    '422':
      description: Provider unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/bad_request_error'
