parameters:
  - $ref: '#/components/parameters/account_id'
  - name: id
    in: path
    required: true
    schema:
      type: number
    description: ID of the group contact
  - name: inbox_id
    in: query
    required: false
    schema:
      type: number
    description: >-
      Which inbox the action is performed as. A group contact is account-scoped, so the
      same WhatsApp group can belong to two inboxes of one account. Optional while a
      group is in a single inbox; required once it is in more than one, since there is
      otherwise no way to tell which number should act. An inbox the group is not in, or
      one the caller is not a member of, is refused. Accepted in the request body as well
      as on the query string.

post:
  tags:
    - Groups
  operationId: contact-group-invite-revoke
  summary: Revoke Group Invite Link
  description: Revokes the current group invite link and returns the newly generated invite code and URL.
  security:
    - userApiKey: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              invite_code:
                type: string
                description: The new group invite code
              invite_url:
                type: string
                description: New full WhatsApp invite URL (https://chat.whatsapp.com/{code})
    '401':
      description: Unauthorized
    '422':
      description: Provider unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/bad_request_error'
