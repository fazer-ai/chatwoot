parameters:
  - $ref: '#/components/parameters/account_id'
  - name: id
    in: path
    required: true
    schema:
      type: number
    description: ID of the group contact
  - name: inbox_id
    in: query
    required: false
    schema:
      type: number
    description: >-
      Which inbox the action is performed as. A group contact is account-scoped, so the
      same WhatsApp group can belong to two inboxes of one account. Optional while a
      group is in a single inbox; required once it is in more than one, since there is
      otherwise no way to tell which number should act. An inbox the group is not in, or
      one the caller is not a member of, is refused. Accepted in the request body as well
      as on the query string.

post:
  tags:
    - Groups
  operationId: contact-group-join-requests-handle
  summary: Handle Group Join Requests
  description: Approves or rejects pending join requests for the WhatsApp group.
  security:
    - userApiKey: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - participants
            - request_action
          properties:
            participants:
              type: array
              description: List of participant JIDs or phone numbers to approve/reject
              items:
                type: string
            request_action:
              type: string
              enum: ['approve', 'reject']
              description: Action to take on the join requests
  responses:
    '200':
      description: Join requests handled successfully
    '401':
      description: Unauthorized
    '422':
      description: Provider unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/bad_request_error'
